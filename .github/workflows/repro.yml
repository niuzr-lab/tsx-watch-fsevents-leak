name: repro
on:
  push:
  workflow_dispatch:
jobs:
  repro:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: npm settings that decide optional dependencies
        run: |
          npm --version
          echo "omit=$(npm config get omit) include=$(npm config get include) os=$(npm config get os) cpu=$(npm config get cpu)"
          env | grep -i '^npm_config' || true
      - run: npm install
      - name: Install fsevents explicitly (macOS only - it is darwin-only)
        if: runner.os == 'macOS'
        run: npm install --no-save --include=optional fsevents@2.3.3
      - run: npm ls fsevents || true
      - run: node leak.cjs
